repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: corepack pnpm lint:ts
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]

      - id: ruff
        name: ruff
        entry: ./.venv/Scripts/ruff.exe check apps/api scripts
        language: system
        pass_filenames: false
        types: [python]

      - id: black
        name: black
        entry: ./.venv/Scripts/black.exe --check apps/api scripts
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: ./.venv/Scripts/mypy.exe apps/api/app scripts
        language: system
        pass_filenames: false
        types: [python]
